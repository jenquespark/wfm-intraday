[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wfm-intraday"
dynamic = ["version"]
description = "Interval-level forecast variance, reforecasting, and staffing gap analysis for contact center WFM teams"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Cenk Yigitoglu", email = "jenque@onpoint.works"},
]
keywords = ["wfm", "workforce-management", "contact-center", "forecasting", "erlang-c", "intraday"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.22",
    "openpyxl>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.5"]
web = ["streamlit>=1.28"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "matplotlib>=3.5", "streamlit>=1.28", "ruff>=0.1", "mypy>=1.0"]

[project.urls]
Homepage = "https://www.onpoint.works"
Repository = "https://github.com/jenquespark/wfm-intraday"

[project.scripts]
wfm-intraday = "wfm_intraday.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
ignore = ["F401"]

[tool.ruff.format]
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["wfm_intraday", "wfm_intraday.*"]

[tool.setuptools.exclude-package-data]
tests = ["*"]

[tool.setuptools.dynamic]
version = {attr = "wfm_intraday._version.__version__"}