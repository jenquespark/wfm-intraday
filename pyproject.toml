[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wfm-reforecast-engine"
version = "0.1.0"
description = "Interval-level forecast vs actual gap analysis and reforecasting for contact center WFM"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Cenk Yigitoglu", email = "jenque@onpoint.works"},
]
keywords = ["wfm", "workforce-management", "contact-center", "forecasting", "erlang-c"]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.22",
    "openpyxl>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.5"]
web = ["streamlit>=1.28"]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "matplotlib>=3.5", "streamlit>=1.28", "ruff>=0.1", "mypy>=1.0"]

[project.urls]
Homepage = "https://www.onpoint.works"
Repository = "https://github.com/jenquespark/wfm-reforecast-engine"

[project.scripts]
wfm-reforecast = "reforecast.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true