# WFM Intraday configuration
# -------------------------
# All values have sensible defaults.  See wfm_intraday/config.py for field docs.

# Interval length (minutes)
interval_length_minutes: 30

# Average handle time (seconds) — fallback when per-row value is missing
aht_seconds: 270

# Shrinkage fraction [0, 1).  Used to convert net -> gross FTE:
#   gross_fte = net_fte / (1 - shrinkage_pct)
shrinkage_pct: 0.34

# Service level target (voice only)  [0, 1]
service_level: 0.80          # 80 % answered within threshold
sl_threshold_seconds: 20
max_occupancy: 0.85

# Chat settings
chat_concurrency: 3
chat_sl_threshold_seconds: 60

# Gap classification thresholds
understaff_threshold_pct: 0.10   # gap > 10 % of scheduled -> understaffed
overstaff_threshold_pct: 0.15    # gap < -15 % of scheduled -> overstaffed

# Reforecast settings
reforecast_blend_factor: 0.50        # how much deviation persists (0-1)

# Redistribution constraints
max_movement_window_intervals: 4   # max intervals apart for a move
max_movement_window_minutes: 120   # max minutes apart for a move

# Default channel (voice / chat)
channel: voice

# Per-channel configuration overrides (optional)
# channels:
#   inbound_calls:
#     channel_type: voice
#   chat:
#     channel_type: chat
#     concurrency: 3