name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run tests
        run: python -m pytest

      - name: Generate sample data and run
        run: |
          wfm-reforecast sample
          wfm-reforecast validate --forecast data/forecast.csv --actual data/actuals.csv --staffing data/schedule.csv
          wfm-reforecast analyze --forecast data/forecast.csv --actual data/actuals.csv --staffing data/schedule.csv --output-dir output